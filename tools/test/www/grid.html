<!doctype html><html><head><title>Grid test</title><style>
body{font-family:sans-serif;margin:10px}
.box{background:#4285f4;color:#fff;padding:10px;border-radius:6px}
.g1{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:200px 1fr auto;gap:8px 20px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));grid-gap:12px;margin-bottom:16px}
.g4{display:grid;grid-template-columns:1fr 2fr 1fr;column-gap:6px;row-gap:14px}
.full{grid-column:1 / -1;background:#34a853}
.span2{grid-column:span 2;background:#ea4335}
.card{background:#f1f3f4;border:1px solid #ccc;padding:12px;border-radius:8px}
</style></head><body>
<h3>repeat(3, 1fr)</h3>
<div class="g1"><div class="box">1</div><div class="box">2</div><div class="box">3</div><div class="box">4</div><div class="box span2">5 (span 2)</div></div>
<h3>200px 1fr auto</h3>
<div class="g2"><div class="box">200px</div><div class="box">reszta (1fr)</div><div class="box">auto tekst</div><div class="box full">cala szerokosc (1 / -1)</div></div>
<h3>auto-fill minmax(180px, 1fr)</h3>
<div class="g3"><div class="card">Karta A z troche dluzszym tekstem w srodku</div><div class="card">Karta B</div><div class="card">Karta C</div><div class="card">Karta D</div><div class="card">Karta E</div><div class="card">Karta F</div><div class="card">Karta G</div></div>
<h3>1fr 2fr 1fr</h3>
<div class="g4"><div class="box">1fr</div><div class="box">2fr</div><div class="box">1fr</div><div class="box">a</div></div>
</body></html>
