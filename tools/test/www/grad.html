<!doctype html><html><head><title>Gradienty</title><style>
body{font-family:sans-serif;margin:10px}
div{height:70px;margin:8px 0;color:#fff;padding:8px;border-radius:0}
.a{background:linear-gradient(to right,#4285f4,#34a853)}
.b{background:linear-gradient(45deg,red,yellow 50%,blue);border-radius:16px}
.c{background-image:radial-gradient(circle,#fff 0%,#fbbc05 60%,#ea4335)}
.d{background:#222 linear-gradient(180deg,rgba(255,255,255,.4),transparent)}
.e{background:radial-gradient(ellipse at center,#8e44ad,#2c3e50);border-radius:35px}
.f{background:linear-gradient(0.25turn,#3f87a6,#ebf8e1,#f69d3c)}
</style></head><body>
<div class="a">to right</div><div class="b">45deg, 3 kolory, zaokraglone</div><div class="c">radial circle</div>
<div class="d">kolor + przezroczysty gradient</div><div class="e">radial elipsa</div><div class="f">0.25turn</div>
</body></html>
